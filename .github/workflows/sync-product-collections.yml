name: Sync product collections

on:
  push:
    branches:
      - main
    paths:
      - "data/product-items/**"
      - "data/products/**"
      - ".pages.yml"
      - "data/categories.json"
      - ".github/workflows/sync-product-collections.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML library
        run: python -m pip install pyyaml

      - name: Migrate and sync products
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          aggregate_names = {
              "magnifier": "magnifier.json",
              "card-mirror": "card-mirror.json",
              "winter": "winter.json",
              "summer": "summer.json",
              "all-season": "all-season.json",
          }

          item_root = Path("data/product-items")
          aggregate_root = Path("data/products")
          item_root.mkdir(parents=True, exist_ok=True)

          aliases = {
              "winter": {
                  "neckwarmer": "neckwarmer",
                  "gloves": "gloves",
                  "earmuffs": "earmuffs",
                  "blanket": "blanket",
                  "footwarmer": "footwarmer",
                  "foot_warmer": "footwarmer",
                  "foot-warmer": "footwarmer",
                  "sets": "sets",
                  "set": "sets",
                  "set_product": "sets",
              },
              "summer": {
                  "cool_arm_sleeves": "arm_sleeves",
                  "arm_sleeves": "arm_sleeves",
                  "cool_scarf": "cool_scarf",
                  "cool_mask": "cool_mask",
                  "cool_towel": "cool_towel",
                  "sets": "sets",
                  "set": "sets",
                  "set_product": "sets",
              },
              "all-season": {
                  "mat": "mat",
                  "socks": "socks",
                  "premium_socks": "socks",
                  "premium-socks": "socks",
                  "buff": "buff",
              }
          }

          def norm(v):
              return str(v or "").strip().lower().replace(" ", "").replace("-", "_")

          def safe_filename(product):
              pid = str(product.get("id") or "").strip()
              if not pid:
                  return None
              return re.sub(r"[^A-Za-z0-9_-]+", "-", pid).strip("-") + ".json"

          def canonical_location(product, fallback_category):
              category = str(product.get("category") or fallback_category or "").strip()
              sub = norm(product.get("subcategory"))

              # Move the entire socks category out of winter into all-season.
              if category == "winter" and sub in {"socks", "sock", "premium_socks"}:
                  product["category"] = "all-season"
                  product["subcategory"] = "socks"
                  return "all-season", "socks"

              # Merge old all-season premium-socks into generic socks.
              if category == "all-season" and sub in {"socks", "sock", "premium_socks"}:
                  product["category"] = "all-season"
                  product["subcategory"] = "socks"
                  return "all-season", "socks"

              if category in aliases:
                  target = aliases[category].get(sub, "_other")
                  # Keep public subcategory ids consistent with categories.json.
                  public_sub = target
                  if category == "winter" and target == "footwarmer":
                      public_sub = "foot-warmer"
                  elif category == "summer" and target == "arm_sleeves":
                      public_sub = "cool-arm-sleeves"
                  elif category == "summer" and target == "cool_scarf":
                      public_sub = "cool-scarf"
                  elif category == "summer" and target == "cool_mask":
                      public_sub = "cool-mask"
                  elif category == "summer" and target == "cool_towel":
                      public_sub = "cool-towel"
                  if target != "_other":
                      product["subcategory"] = public_sub
                  return category, target

              return category, None

          # Seed missing per-product files from aggregate arrays.
          existing_ids = set()
          for p in item_root.rglob("*.json"):
              try:
                  obj = json.loads(p.read_text(encoding="utf-8"))
                  if isinstance(obj, dict) and obj.get("id"):
                      existing_ids.add(str(obj["id"]))
              except Exception:
                  pass

          for category, agg_name in aggregate_names.items():
              agg = aggregate_root / agg_name
              if not agg.exists():
                  continue
              try:
                  data = json.loads(agg.read_text(encoding="utf-8"))
              except Exception:
                  continue
              if not isinstance(data, list):
                  continue

              for idx, product in enumerate(data, start=1):
                  if not isinstance(product, dict) or not product.get("id"):
                      continue
                  if str(product["id"]) in existing_ids:
                      continue
                  if product.get("display_order") in (None, ""):
                      product["display_order"] = idx * 10

                  target_cat, target_sub = canonical_location(product, category)
                  target_dir = item_root / target_cat
                  if target_sub:
                      target_dir = target_dir / target_sub
                  target_dir.mkdir(parents=True, exist_ok=True)

                  filename = safe_filename(product)
                  if filename:
                      (target_dir / filename).write_text(
                          json.dumps(product, ensure_ascii=False, indent=2) + "\n",
                          encoding="utf-8"
                      )
                      existing_ids.add(str(product["id"]))

          # Reorganize all existing item files into their canonical folders.
          files = list(item_root.rglob("*.json"))
          for src in files:
              try:
                  product = json.loads(src.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Skip invalid {src}: {e}")
                  continue
              if not isinstance(product, dict):
                  continue

              try:
                  fallback = src.relative_to(item_root).parts[0]
              except Exception:
                  fallback = str(product.get("category") or "")

              target_cat, target_sub = canonical_location(product, fallback)
              target_dir = item_root / target_cat
              if target_sub:
                  target_dir = target_dir / target_sub
              target_dir.mkdir(parents=True, exist_ok=True)

              filename = safe_filename(product) or src.name
              dest = target_dir / filename

              # Always write canonicalized JSON.
              dest.write_text(
                  json.dumps(product, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              if src.resolve() != dest.resolve() and src.exists():
                  src.unlink()
                  print(f"Moved {src} -> {dest}")

          # Remove empty legacy directories where possible.
          for d in sorted(item_root.rglob("*"), reverse=True):
              if d.is_dir():
                  try:
                      d.rmdir()
                  except OSError:
                      pass

          # Rebuild website aggregate arrays recursively.
          for category, agg_name in aggregate_names.items():
              cat_dir = item_root / category
              items = []
              if cat_dir.exists():
                  for p in cat_dir.rglob("*.json"):
                      try:
                          obj = json.loads(p.read_text(encoding="utf-8"))
                      except Exception:
                          continue
                      if isinstance(obj, dict):
                          items.append(obj)

              def order_key(product):
                  try:
                      order = float(product.get("display_order"))
                  except (TypeError, ValueError):
                      order = 999999999
                  return (order, str(product.get("title", "")).lower())

              items.sort(key=order_key)
              aggregate_root.mkdir(parents=True, exist_ok=True)
              (aggregate_root / agg_name).write_text(
                  json.dumps(items, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )
              print(f"[{category}] synced {len(items)} products")
          PY

      - name: Sync related set product choices
        shell: bash
        run: |
          python - <<'PY'
          import json
          import copy
          from pathlib import Path
          import yaml

          pages_path = Path(".pages.yml")
          item_root = Path("data/product-items")

          config = yaml.safe_load(pages_path.read_text(encoding="utf-8"))

          def norm(value):
              return str(value or "").strip().lower().replace(" ", "").replace("-", "_")

          def is_set_product(product):
              return (
                  norm(product.get("set_type")) in {"set_product", "setproduct", "세트상품"}
                  or norm(product.get("subcategory")) in {"sets", "set", "set_product", "setproduct", "세트상품"}
              )

          set_products = []

          for item_path in sorted(item_root.rglob("*.json")):
              try:
                  product = json.loads(item_path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if not isinstance(product, dict):
                  continue

              if (
                  product.get("id")
                  and product.get("published", True) is not False
                  and is_set_product(product)
              ):
                  set_products.append(product)

          def order_key(product):
              raw = product.get("display_order")
              try:
                  order = float(raw)
              except (TypeError, ValueError):
                  order = 999999999
              return (order, str(product.get("title", "")).lower())

          set_products.sort(key=order_key)

          values = [
              {
                  "name": str(product["id"]),
                  "label": str(product.get("title") or product["id"])
              }
              for product in set_products
          ]

          def update_node(node):
              updated = 0

              if isinstance(node, dict):
                  fields = node.get("fields")
                  if isinstance(fields, list):
                      for field in fields:
                          if isinstance(field, dict) and field.get("name") == "related_set_products":
                              field.clear()
                              field.update({
                                  "name": "related_set_products",
                                  "label": "관련 세트상품",
                                  "type": "select",
                                  "description": "이미 등록된 세트상품 중 상세페이지에 보여줄 상품을 여러 개 선택하세요.",
                                  "options": {
                                      "multiple": True,
                                      "values": copy.deepcopy(values)
                                  }
                              })
                              updated += 1

                  items = node.get("items")
                  if isinstance(items, list):
                      for item in items:
                          updated += update_node(item)

              elif isinstance(node, list):
                  for item in node:
                      updated += update_node(item)

              return updated

          updated = update_node(config.get("content", []))

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          pages_path.write_text(
              yaml.dump(
                  config,
                  Dumper=NoAliasDumper,
                  allow_unicode=True,
                  sort_keys=False,
                  width=120
              ),
              encoding="utf-8"
          )

          print(f"Found {len(set_products)} set products.")
          print(f"Updated {updated} related-set fields.")
          for product in set_products:
              print(" -", product.get("title", ""))
          PY

      - name: Commit migrated and synced files
        shell: bash
        run: |
          git add data/product-items data/products .pages.yml

          if git diff --cached --quiet; then
            echo "No product sync changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync nested product collections"
          git push
