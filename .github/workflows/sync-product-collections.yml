name: Sync product collections

on:
  push:
    branches:
      - main
    paths:
      - "data/product-items/**"
      - "data/products/**"
      - ".github/workflows/sync-product-collections.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install YAML library
        run: python -m pip install pyyaml

      - name: Migrate and sync products
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import shutil
          from pathlib import Path

          categories = {
              "magnifier": "magnifier.json",
              "card-mirror": "card-mirror.json",
              "winter": "winter.json",
              "summer": "summer.json",
              "all-season": "all-season.json",
          }

          nested_subfolders = {
              "winter": {
                  "neckwarmer": "neckwarmer",
                  "gloves": "gloves",
                  "earmuffs": "earmuffs",
                  "blanket": "blanket",
                  "socks": "socks",
                  "footwarmer": "footwarmer",
                  "sets": "sets",
              },
              "summer": {
                  "arm_sleeves": "arm_sleeves",
                  "cool_scarf": "cool_scarf",
                  "cool_mask": "cool_mask",
                  "cool_towel": "cool_towel",
                  "sets": "sets",
              }
          }

          # Compatibility aliases: if old data used a slightly different id,
          # move it to the correct current admin folder instead of losing it.
          sub_aliases = {
              "winter": {
                  "neckwarmer": "neckwarmer",
                  "neck_warmer": "neckwarmer",
                  "넥워머": "neckwarmer",

                  "gloves": "gloves",
                  "glove": "gloves",
                  "warmgloves": "gloves",
                  "warm_gloves": "gloves",
                  "장갑": "gloves",

                  "earmuffs": "earmuffs",
                  "earmuff": "earmuffs",
                  "귀마개": "earmuffs",

                  "blanket": "blanket",
                  "blankets": "blanket",
                  "담요": "blanket",

                  "socks": "socks",
                  "sock": "socks",
                  "양말": "socks",

                  "footwarmer": "footwarmer",
                  "foot_warmer": "footwarmer",
                  "발토시": "footwarmer",

                  "sets": "sets",
                  "set": "sets",
                  "set_product": "sets",
                  "세트상품": "sets",
              },
              "summer": {
                  "arm_sleeves": "arm_sleeves",
                  "armsleeves": "arm_sleeves",
                  "cool_sleeves": "arm_sleeves",
                  "쿨토시": "arm_sleeves",

                  "cool_scarf": "cool_scarf",
                  "coolscarf": "cool_scarf",
                  "쿨스카프": "cool_scarf",

                  "cool_mask": "cool_mask",
                  "coolmask": "cool_mask",
                  "쿨마스크": "cool_mask",

                  "cool_towel": "cool_towel",
                  "cooltowel": "cool_towel",
                  "쿨타올": "cool_towel",

                  "sets": "sets",
                  "set": "sets",
                  "set_product": "sets",
                  "세트상품": "sets",
              }
          }

          source_root = Path("data/products")
          item_root = Path("data/product-items")
          item_root.mkdir(parents=True, exist_ok=True)

          def read_array(path):
              if not path.exists():
                  return []
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Could not read {path}: {e}")
                  return []
              return data if isinstance(data, list) else []

          def safe_filename(product):
              pid = str(product.get("id") or "").strip()
              if not pid:
                  return None
              return re.sub(r"[^A-Za-z0-9_-]+", "-", pid).strip("-") + ".json"

          def norm(value):
              return str(value or "").strip().lower().replace(" ", "").replace("-", "_")

          def target_subfolder(category, product):
              if category not in nested_subfolders:
                  return None
              raw = norm(product.get("subcategory"))
              return sub_aliases.get(category, {}).get(raw, "_other")

          def add_initial_order(products):
              for idx, product in enumerate(products, start=1):
                  if isinstance(product, dict) and product.get("display_order") in (None, ""):
                      product["display_order"] = idx * 10

          # 1) Migrate legacy aggregate arrays into per-product files if not already present.
          for category, aggregate_name in categories.items():
              aggregate_path = source_root / aggregate_name
              category_dir = item_root / category
              category_dir.mkdir(parents=True, exist_ok=True)

              current = read_array(aggregate_path)
              add_initial_order(current)

              for product in current:
                  if not isinstance(product, dict):
                      continue
                  filename = safe_filename(product)
                  if not filename:
                      continue

                  subfolder = target_subfolder(category, product)
                  if subfolder:
                      dest_dir = category_dir / subfolder
                  else:
                      dest_dir = category_dir
                  dest_dir.mkdir(parents=True, exist_ok=True)

                  dest = dest_dir / filename

                  # Don't overwrite a newer per-product CMS file.
                  if not dest.exists():
                      # Search recursively in case this product already exists elsewhere.
                      existing = list(category_dir.rglob(filename))
                      if not existing:
                          dest.write_text(
                              json.dumps(product, ensure_ascii=False, indent=2) + "\n",
                              encoding="utf-8"
                          )

          # 2) Move any existing flat winter/summer JSON files into the right subfolder.
          for category in ("winter", "summer"):
              category_dir = item_root / category
              if not category_dir.exists():
                  continue

              for flat_file in list(category_dir.glob("*.json")):
                  try:
                      product = json.loads(flat_file.read_text(encoding="utf-8"))
                  except Exception as e:
                      print(f"Skip invalid {flat_file}: {e}")
                      continue

                  if not isinstance(product, dict):
                      continue

                  subfolder = target_subfolder(category, product) or "_other"
                  dest_dir = category_dir / subfolder
                  dest_dir.mkdir(parents=True, exist_ok=True)
                  dest = dest_dir / flat_file.name

                  if dest.exists():
                      # Keep the destination copy and remove the duplicate flat file.
                      flat_file.unlink()
                  else:
                      shutil.move(str(flat_file), str(dest))

                  print(f"Moved {category}/{flat_file.name} -> {category}/{subfolder}/{flat_file.name}")

          # 3) Rebuild website aggregate JSON from per-product files recursively.
          for category, aggregate_name in categories.items():
              aggregate_path = source_root / aggregate_name
              category_dir = item_root / category
              category_dir.mkdir(parents=True, exist_ok=True)

              items = []
              for item_path in sorted(category_dir.rglob("*.json")):
                  try:
                      product = json.loads(item_path.read_text(encoding="utf-8"))
                  except Exception as e:
                      print(f"Skip invalid {item_path}: {e}")
                      continue

                  if isinstance(product, dict):
                      items.append(product)

              def order_key(product):
                  raw = product.get("display_order")
                  try:
                      order = float(raw)
                  except (TypeError, ValueError):
                      order = 999999999
                  return (order, str(product.get("title", "")).lower())

              items.sort(key=order_key)

              aggregate_path.parent.mkdir(parents=True, exist_ok=True)
              aggregate_path.write_text(
                  json.dumps(items, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

              print(f"[{category}] synced {len(items)} products")

          PY

      - name: Sync related set product choices
        shell: bash
        run: |
          python - <<'PY'
          import json
          import copy
          from pathlib import Path
          import yaml

          pages_path = Path(".pages.yml")
          item_root = Path("data/product-items")

          config = yaml.safe_load(pages_path.read_text(encoding="utf-8"))

          def norm(value):
              return str(value or "").strip().lower().replace(" ", "").replace("-", "_")

          def is_set_product(product):
              return (
                  norm(product.get("set_type")) in {"set_product", "setproduct", "세트상품"}
                  or norm(product.get("subcategory")) in {"sets", "set", "set_product", "setproduct", "세트상품"}
              )

          set_products = []

          for item_path in sorted(item_root.rglob("*.json")):
              try:
                  product = json.loads(item_path.read_text(encoding="utf-8"))
              except Exception:
                  continue

              if not isinstance(product, dict):
                  continue

              if (
                  product.get("id")
                  and product.get("published", True) is not False
                  and is_set_product(product)
              ):
                  set_products.append(product)

          def order_key(product):
              raw = product.get("display_order")
              try:
                  order = float(raw)
              except (TypeError, ValueError):
                  order = 999999999
              return (order, str(product.get("title", "")).lower())

          set_products.sort(key=order_key)

          values = [
              {
                  "name": str(product["id"]),
                  "label": str(product.get("title") or product["id"])
              }
              for product in set_products
          ]

          def update_node(node):
              updated = 0

              if isinstance(node, dict):
                  fields = node.get("fields")
                  if isinstance(fields, list):
                      for field in fields:
                          if isinstance(field, dict) and field.get("name") == "related_set_products":
                              field.clear()
                              field.update({
                                  "name": "related_set_products",
                                  "label": "관련 세트상품",
                                  "type": "select",
                                  "description": "이미 등록된 세트상품 중 상세페이지에 보여줄 상품을 여러 개 선택하세요.",
                                  "options": {
                                      "multiple": True,
                                      "values": copy.deepcopy(values)
                                  }
                              })
                              updated += 1

                  items = node.get("items")
                  if isinstance(items, list):
                      for item in items:
                          updated += update_node(item)

              elif isinstance(node, list):
                  for item in node:
                      updated += update_node(item)

              return updated

          updated = update_node(config.get("content", []))

          class NoAliasDumper(yaml.SafeDumper):
              def ignore_aliases(self, data):
                  return True

          pages_path.write_text(
              yaml.dump(
                  config,
                  Dumper=NoAliasDumper,
                  allow_unicode=True,
                  sort_keys=False,
                  width=120
              ),
              encoding="utf-8"
          )

          print(f"Found {len(set_products)} set products.")
          print(f"Updated {updated} related-set fields.")
          for product in set_products:
              print(" -", product.get("title", ""))
          PY

      - name: Commit migrated and synced files
        shell: bash
        run: |
          git add data/product-items data/products .pages.yml

          if git diff --cached --quiet; then
            echo "No product sync changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync nested product collections"
          git push
