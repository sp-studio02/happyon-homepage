name: Sync set product references

on:
  push:
    branches:
      - main
    paths:
      - "data/products/**"
      - ".pages.yml"
      - ".github/workflows/sync-set-product-references.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build set product reference files
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          source_dir = Path("data/products")
          out_dir = Path("data/set-product-references")
          out_dir.mkdir(parents=True, exist_ok=True)

          for f in out_dir.glob("*.json"):
              f.unlink()

          products = []

          def add_products(data):
              if isinstance(data, list):
                  products.extend(x for x in data if isinstance(x, dict))
              elif isinstance(data, dict):
                  for key in ("products", "items", "data"):
                      value = data.get(key)
                      if isinstance(value, list):
                          products.extend(x for x in value if isinstance(x, dict))
                          return

          for path in sorted(source_dir.glob("*.json")):
              try:
                  data = json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  print(f"Skip {path}: {e}")
                  continue
              add_products(data)

          def norm(v):
              return str(v or "").strip().lower().replace(" ", "").replace("-", "_")

          def is_set_product(p):
              set_type = norm(p.get("set_type"))
              subcategory = norm(p.get("subcategory"))

              if set_type in {"set_product", "setproduct", "세트상품"}:
                  return True

              if subcategory in {"sets", "set", "set_product", "setproduct", "세트상품"}:
                  return True

              return False

          set_products = [
              p for p in products
              if p.get("id")
              and p.get("published", True) is not False
              and is_set_product(p)
          ]

          for p in set_products:
              product_id = str(p.get("id", "")).strip()
              safe_id = re.sub(r"[^A-Za-z0-9_-]+", "-", product_id).strip("-") or "set-product"

              ref = {
                  "id": product_id,
                  "title": p.get("title", ""),
                  "category": p.get("category", ""),
                  "subcategory": p.get("subcategory", ""),
                  "hero_image": p.get("hero_image", ""),
                  "summary": p.get("summary", ""),
              }

              (out_dir / f"{safe_id}.json").write_text(
                  json.dumps(ref, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8"
              )

          print(f"Found {len(products)} products total.")
          print(f"Synced {len(set_products)} set products.")
          for p in set_products:
              print(" -", p.get("title", ""), "|", p.get("subcategory", ""), "|", p.get("set_type", ""))
          PY

      - name: Commit generated reference files
        shell: bash
        run: |
          git add data/set-product-references

          if git diff --cached --quiet; then
            echo "No reference changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync set product references"
          git push
