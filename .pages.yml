      type: image
      description: 여러 장을 한 번에 선택할 수 있습니다.
      options:
        multiple:
          max: 30
        unique: true
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
    - name: features
      label: 주요 특징
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
      fields:
      - name: title
        label: 특징 제목
        type: string
      - name: description
        label: 설명
        type: text
    - name: dimensions
      label: 규격
      type: string
      description: 상세페이지 이미지에만 표기할 경우 '상세페이지 참고'로 두세요.
    - name: material
      label: 재질
      type: string
      description: 상세페이지 이미지에만 표기할 경우 '상세페이지 참고'로 두세요.
    - name: colors
      label: 색상
      type: string
    - name: default_order_quantity
      label: 기본 주문수량
      type: string
      description: 예) 100개. 입력하면 '기본 주문수량 미만은 별도 연락해 주세요.' 문구가 자동 표시됩니다.
    - name: production_time
      label: 제작기간
      type: string
    - name: print_method
      label: 인쇄·제작 방식
      type: text
    - name: packaging
      label: 포장 방식
      type: text
    - name: set_type
      label: 세트 유형
      type: select
      description: 세트상품 / 세트 구성 가능 / 세트 구성 불가 중 해당 유형을 선택하세요.
      options:
        values:
        - name: set_product
          label: 세트상품
        - name: set_available
          label: 세트 구성 가능
        - name: set_unavailable
          label: 세트 구성 불가
    - name: related_set_products
      label: 관련 세트상품
      type: select
      description: 이미 등록된 세트상품 중 상세페이지에 보여줄 상품을 여러 개 선택하세요.
      options:
        multiple: true
        values:
        - name: ee0cfb2d-dfef-41ab-a65a-fc8c2b9818f2
          label: 레포마 추위대비 2종 A세트(넥워머+방한장갑)
    - name: set_name
      label: 세트 구성명
      type: string
      description: 세트상품을 선택한 경우에만 작성하세요.
    - name: set_contents
      label: 구성 제품
      type: string
      list: true
      description: 세트상품을 선택한 경우에만 구성품을 추가하세요.
    - name: set_packaging
      label: 세트 포장 형태
      type: string
      description: 세트상품을 선택한 경우에만 작성하세요. 예) 지퍼백 / 복주머니 / 종이케이스
    - name: set_description
      label: 세트 설명
      type: text
      description: 세트상품을 선택한 경우에만 작성하세요.
    - name: set_image
      label: 세트 이미지
      type: image
      description: 세트상품을 선택한 경우에만 등록하세요.
      options:
        extensions:
        - jpg
        - jpeg
        - png
        - webp
        rename: safe
    filename:
      template: '{fields.id}.json'
      field: false
    view:
      primary: title
      fields:
      - display_order
      - title
      - subcategory
      - published
      search:
      - title
      - subcategory
      sort:
      - display_order
      - title
      default:
        sort: display_order
        order: asc
