media:
  input: assets/uploads
  output: assets/uploads
  rename: safe
  categories:
  - image
settings:
  hide: false
  content:
    merge: true
content:
- name: site
  label: 회사 기본정보
  type: file
  path: data/site.json
  format: json
  operations:
    delete: false
    rename: false
  fields:
  - name: company_name
    label: 회사명
    type: string
    required: true
  - name: company_name_en
    label: 영문 회사명
    type: string
    required: true
  - name: ceo
    label: 대표자명
    type: string
  - name: business_number
    label: 사업자등록번호
    type: string
  - name: address
    label: 사업장 주소
    type: string
  - name: phone
    label: 대표 전화번호
    type: string
  - name: email
    label: 이메일
    type: string
  - name: fax
    label: 팩스번호
    type: string
  - name: domain
    label: 홈페이지 도메인
    type: string
  - name: established
    label: 설립연도
    type: number
  - name: logo
    label: 로고
    type: image
    options:
      extensions:
      - png
      - jpg
      - jpeg
      - webp
      - svg
      rename: safe
  - name: tagline
    label: 회사 한 줄 소개
    type: string
  - name: hero_title
    label: 메인 제목
    type: string
  - name: hero_description
    label: 메인 설명
    type: text
  - name: about_short
    label: 회사소개 짧은 문구
    type: text
  - name: about_long
    label: 회사소개 본문
    type: text
