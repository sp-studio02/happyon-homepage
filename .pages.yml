- name: product_management
  label: 상품 관리
  type: group
  items:
  - name: summer_products_group
    label: 여름제품
    type: group
    items:
    - name: summer_arm_sleeves
      label: 쿨토시
      type: collection
      path: data/product-items/summer/arm_sleeves
      format: json
      filename:
        template: '{fields.id}.json'
        field: false
      view:
        primary: title
        fields:
        - display_order
        - title
        - published
        search:
        - title
        sort:
        - display_order
        - title
        default:
          sort: display_order
          order: asc
      operations:
        create: true
        rename: false
        delete: true
      fields:
      - name: id
        label: 상품 ID
        type: uuid
        readonly: true
        options:
          editable: false
      - name: title
        label: 상품명
        type: string
        required: true
      - name: display_order
        label: 노출 순서
        type: number
        description: '숫자가 작을수록 먼저 표시됩니다. 예: 10, 20, 30 / 중간 삽입은 15'
      - name: category
        label: 대분류
        type: select
        required: true
        default: summer
        options:
          values:
          - name: summer
            label: 여름제품
      - name: subcategory
        label: 세부 품목
        type: select
        required: true
        options:
          values:
          - name: cool-arm-sleeves
            label: 쿨토시
          - name: cool-scarf
            label: 쿨스카프
          - name: cool-mask
            label: 쿨마스크
          - name: cool-towel
            label: 쿨타올
          - name: sets
            label: 세트상품
      - name: summary
        label: 한 줄 설명
        type: text
      - name: published
        label: 홈페이지 공개
        type: boolean
        default: true
      - name: featured
        label: 메인 대표상품
        type: boolean
        default: false
      - name: home_slide_order
        label: 메인 슬라이드 노출 순서
        type: select
        default: none
        description: 메인 슬라이드에 보여줄 상품 3개만 1·2·3 순서로 지정하세요.
        options:
          values:
          - name: none
            label: 노출 안 함
          - name: '1'
            label: 1번째
          - name: '2'
            label: 2번째
          - name: '3'
            label: 3번째
      - name: hero_image
        label: 대표이미지
        type: image
        options:
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          rename: safe
      - name: gallery
        label: 상세이미지
        type: image
        description: 여러 장을 한 번에 선택할 수 있습니다.
        options:
          multiple:
            max: 30
          unique: true
          extensions:
          - jpg
          - jpeg
          - png
          - webp
          rename: safe
      - name: features
        label: 주요 특징
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
        - name: title
          label: 특징 제목
          type: string
        - name: description
          label: 설명
          type: text
      - name: dimensions
        label: 규격
        type: string
        description: 상세페이지 이미지에만 표기할 경우 '상세페이지 참고'로 두세요.
      - name: material
        label: 재질
        type: string
        description: 상세페이지 이미지에만 표기할 경우 '상세페이지 참고'로 두세요.
      - name: colors
        label: 색상
        type: string
      - name: default_order_quantity
        label: 기본 주문수량
        type: string
        description: 예) 100개. 입력하면 '기본 주문수량 미만은 별도 연락해 주세요.' 문구가 자동 표시됩니다.
      - name: production_time
        label: 제작기간
        type: string
      - name: print_method
        label: 인쇄·제작 방식
        type: text
      - name: packaging
        label: 포장 방식
        type: text
      - name: set_type
        label: 세트 유형
        type: select
        description: 세트상품 / 세트 구성 가능 / 세트 구성 불가 중 해당 유형을 선택하세요.
        options:
          values:
          - name: set_product
            label: 세트상품
          - name: set_available
            label: 세트 구성 가능
          - name: set_unavailable
            label: 세트 구성 불가
      - name: related_set_products
        label: 관련 세트상품
        type: select
        description: 이미 등록된 세트상품 중 상세페이지에 보여줄 상품을 여러 개 선택하세요.
        options:
          multiple: true
          values:
          - name: ee0cfb2d-dfef-41ab-a65a-fc8c2b9818f2
            label: 레포마 추위대비 2종 A세트(넥워머+방한장갑)
          - name: 235fc733-c463-43fe-831e-3430894f2862
            label: 레포마 폭염예방 실용 3종 쿨키트 S (스노우 쿨토시+스노우 쿨마스크+최고급 쿨타올)
          - name: ea23da25-90c9-469e-9617-7401ff0b1e07
            label: 레포마 추위대비 2종 B세트(넥워머+귀마개)
          - name: 0c6bea85-6457-4d54-8057-d05a6a772dc2
            label: 레포마 추위대비 2종 C세트(웜 방한장갑+귀마개)
          - name: c07454f6-4577-4069-8ce7-44353b586e0d
            label: 레포마 추위대비 3종 S세트(넥워머+웜장갑+귀마개)
          - name: 1f2c2303-396d-4645-b29c-c0389c324291
            label: 레포마 까사 윈터 2종 A세트(까사장갑+넥워머)
          - name: c2f380a6-9d96-44e8-8ecc-8fa8efc0b7a4
            label: 레포마 까사 윈터 2종 B세트(까사장갑+귀마개)
          - name: f9468b33-dacf-4817-b530-c91573446212
            label: 레포마 까사 윈터 3종 S세트(까사장갑+넥워머+귀마개)
          - name: 2cf9f72f-4ddd-4383-96a2-a7f42b703cc3
            label: 레포마 실용한파 2종 복조리개 세트(웜장갑+넥워머)
          - name: ba90f3e7-978e-4295-9fcb-39b44833ab26
            label: 레포마 실용한파 3종 복조리개 세트(웜장갑+넥워머+귀마개)
          - name: 892f9a24-1644-4443-bef3-4a04cc50a5d4
            label: 레포마 겨울대비 3종 복주머니 세트(융 스토퍼 넥워머+폰터치겨울장갑+귀마개)
          - name: 23c9c605-6471-4425-9f76-e4dd34d2f4d6
