          - name: 5b705771-eba1-4477-a74d-f12ba2d9731c
            label: 레포마 웜가드 기모넥워머 + 귀마개 복조리세트
          - name: 4a6d7a89-7c52-4b0f-9985-259b135aa767
            label: 레포마 웜가드 기모넥워머 + 폰터치겨울장갑 복조리 세트
          - name: dd55dcd2-5651-4b2e-bd4c-fdf3666d633c
            label: 레포마 웜가드 기모넥워머 + 3중 등산양말 복조리 세트
          - name: 6f6f77e2-c41e-4a83-bf42-b81251103cfe
            label: 레포마 웜가드 기모넥워머 + 멀티스카프 복조리 세트
          - name: 857a1a18-a3ed-4061-8a94-5159e8a0784d
            label: 레포마 리버시블 양면 넥워머 + 귀마개 복조리세트
          - name: a4f4f601-b21e-428e-81b8-b4a599e2287b
            label: 레포마 리버시블 양면 넥워머 + 폰 터치 겨울장갑 복조리세트
          - name: 439cd794-abbd-487c-b123-bac8fc2ece7f
            label: 레포마 리버시블 양면 넥워머 + 3중 등산양말 복조리세트
