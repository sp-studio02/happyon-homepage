<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HAPPYON 상품 데이터 분리 도구</title>
<style>
body{font-family:Arial,sans-serif;max-width:760px;margin:50px auto;padding:0 20px;line-height:1.6;color:#171717}
button{padding:12px 18px;margin:6px;border:0;background:#181818;color:#fff;cursor:pointer}
.box{background:#f5f5f5;padding:18px;margin:20px 0}
.good{color:#087b45;font-weight:700}.bad{color:#c52121;font-weight:700}
</style>
</head>
<body>
<h1>해피온 상품 데이터 분리</h1>
<p>현재 사이트의 <code>data/products.json</code>을 그대로 읽어서 카테고리별 5개 파일로 나눕니다.</p>
<div id="status" class="box">불러오는 중...</div>
<div id="buttons"></div>

<script>
const files = {
  "magnifier":"magnifier.json",
  "card-mirror":"card-mirror.json",
  "winter":"winter.json",
  "summer":"summer.json",
  "all-season":"all-season.json"
};

let groups = {};
function download(name,data){
  const blob = new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
(async()=>{
  try{
    const r=await fetch("data/products.json?ts="+Date.now(),{cache:"no-store"});
    if(!r.ok) throw new Error("products.json을 불러오지 못했습니다.");
    const products=await r.json();
    Object.keys(files).forEach(k=>groups[k]=products.filter(p=>p.category===k));
    document.getElementById("status").innerHTML =
      '<span class="good">현재 상품 '+products.length+'개를 정상적으로 읽었습니다.</span><br>'+
      Object.entries(groups).map(([k,v])=>`${files[k]} : ${v.length}개`).join("<br>");
    document.getElementById("buttons").innerHTML =
      Object.entries(files).map(([k,name])=>`<button data-k="${k}" data-name="${name}">${name} 다운로드 (${groups[k].length})</button>`).join("");
    document.querySelectorAll("button").forEach(b=>b.onclick=()=>download(b.dataset.name,groups[b.dataset.k]));
  }catch(e){
    document.getElementById("status").innerHTML='<span class="bad">'+e.message+'</span>';
  }
})();
</script>
</body>
</html>
