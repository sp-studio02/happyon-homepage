<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>제품 카테고리 | 해피온</title>
  <meta name="description" content="해피온 제품 카테고리">
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="sub-hero">
    <div class="container">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <p class="eyebrow" id="cat-eyebrow">PRODUCTS</p>
      <h1 id="cat-title">제품</h1>
      <p id="cat-desc"></p>
    </div>
  </section>

  <section class="section" id="sub-section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow" id="sub-section-eyebrow">SUB CATEGORY</p>
          <h2 id="sub-section-title">세부 품목</h2>
        </div>
      </div>
      <div class="subcategory-grid" id="subcategory-list"></div>
    </div>
  </section>

  <section class="section soft" id="list-section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">PRODUCT LIST</p>
          <h2 id="list-title">등록 상품</h2>
        </div>
        <a class="text-link" id="back-cat" href="#">전체 세부 품목 보기 →</a>
      </div>
      <div class="product-grid" id="category-products"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/seed.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async()=>{
  const d = await H.load();

  let winterThumbs = {};
  try{
    const r = await fetch(`data/winter-category-thumbnails.json?ts=${Date.now()}`, {cache:'no-store'});
    if(r.ok) winterThumbs = await r.json();
  }catch(e){}

  H.headerFooter(d.site,'products');

  const cid = H.q('category');
  const sid = H.q('sub');
  const setpack = H.q('setpack');
  const c = d.categories.find(x=>x.id===cid) || d.categories[0];
  const s = (c.subs||[]).find(x=>x.id===sid);

  const setPackGroups = [
    {id:'zipper_bag', label:'지퍼백 세트'},
    {id:'pouch', label:'복주머니 세트'},
    {id:'paper_handle_case', label:'손잡이 종이케이스 세트'}
  ];

  const normValue=(v)=>String(v||'')
    .trim()
    .toLowerCase()
    .replace(/\s+/g,'')
    .replace(/-/g,'_');

  const setSubValues=new Set([
    'sets','set','set_product','setproduct','세트상품'
  ]);

  const packageValueMap={
    'zipper_bag':'zipper_bag',
    'zipperbag':'zipper_bag',
    '지퍼백':'zipper_bag',
    '지퍼백세트':'zipper_bag',

    'pouch':'pouch',
    '복주머니':'pouch',
    '복주머니세트':'pouch',
    '복조리':'pouch',
    '복조리세트':'pouch',
    '복조리개':'pouch',
    '복조리개세트':'pouch',

    'paper_handle_case':'paper_handle_case',
    'paperhandlecase':'paper_handle_case',
    '손잡이종이케이스':'paper_handle_case',
    '손잡이종이케이스세트':'paper_handle_case',
    '종이케이스':'paper_handle_case',
    '종이케이스세트':'paper_handle_case'
  };

  const getPackageId=(p)=>{
    const raw=normValue(p && p.set_package_category);
    return packageValueMap[raw] || raw;
  };

  const activeSetPack = setPackGroups.find(x=>x.id===setpack);
  const isWinterSets =
    c.id==='winter' &&
    s &&
    setSubValues.has(normValue(s.id));

  document.title =
    (activeSetPack ? activeSetPack.label+' | ' : '') +
    (s ? s.label+' | ' : '') +
    c.label + ' | 해피온';

  document.getElementById('cat-eyebrow').textContent = c.eyebrow || 'PRODUCTS';
  document.getElementById('cat-title').textContent = activeSetPack
    ? activeSetPack.label
    : (s ? s.label : c.label);

  document.getElementById('cat-desc').textContent = activeSetPack
    ? `${c.label} > 세트상품 > ${activeSetPack.label}에 등록된 상품입니다.`
    : (s
        ? `${c.label} > ${s.label}에 등록된 상품입니다.`
        : c.desc);

  let breadcrumbTail = `<strong>${H.esc(c.label)}</strong>`;

  if(s){
    breadcrumbTail =
      `<a href="category.html?category=${encodeURIComponent(c.id)}">${H.esc(c.label)}</a><span>›</span>` +
      (activeSetPack
        ? `<a href="category.html?category=${encodeURIComponent(c.id)}&sub=sets">세트상품</a><span>›</span><strong>${H.esc(activeSetPack.label)}</strong>`
        : `<strong>${H.esc(s.label)}</strong>`);
  }

  document.getElementById('breadcrumbs').innerHTML =
    `<a href="index.html">홈</a><span>›</span>
     <a href="products.html">제품소개</a><span>›</span>
     ${breadcrumbTail}`;

  const subsec = document.getElementById('sub-section');
  const listsec = document.getElementById('list-section');
  const back = document.getElementById('back-cat');

  if(isWinterSets){
    const allSetProducts = d.products.filter(p =>
      p.published !== false &&
      p.category === 'winter' &&
      setSubValues.has(normValue(p.subcategory))
    );

    if(activeSetPack){
      // 세트 포장 소카테고리를 선택한 화면
      subsec.style.display = 'none';
      listsec.style.display = 'block';
      back.href = `category.html?category=winter&sub=sets`;
      back.textContent = '세트상품 소카테고리 보기 →';
      document.getElementById('list-title').textContent = activeSetPack.label;

      const list = allSetProducts.filter(p =>
        getPackageId(p) === activeSetPack.id
      );

      document.getElementById('category-products').innerHTML =
        list.map(H.productCard).join('') ||
        '<div class="empty">아직 이 소카테고리로 분류된 상품이 없습니다.</div>';
    }else{
      // 겨울 > 세트상품 첫 화면:
      // 포장 기준 소카테고리 3개 + 전체 세트상품을 함께 보여준다.
      subsec.style.display = 'block';
      listsec.style.display = 'block';

      document.getElementById('sub-section-eyebrow').textContent = 'SET CATEGORY';
      document.getElementById('sub-section-title').textContent = '세트상품 소카테고리';

      back.href = `category.html?category=winter`;
      back.textContent = '겨울제품 전체 세부 품목 보기 →';
      document.getElementById('list-title').textContent = '전체 세트상품';

      document.getElementById('subcategory-list').innerHTML =
        setPackGroups.map((group,i)=>{
          const items = allSetProducts.filter(p =>
            getPackageId(p) === group.id
          );

          const n = items.length;
          const first = items[0];
          const thumbKey = `winter_sets_${group.id}`.replace(/-/g,'_');
          const customThumb = winterThumbs[thumbKey] || '';
          const thumbSrc = customThumb || (first && first.hero_image ? first.hero_image : '');

          const thumb = thumbSrc
            ? `<img src="${H.esc(thumbSrc.replace(/^\//,''))}" alt="${H.esc(group.label)}">`
            : `<div class="subcategory-placeholder"><span>${H.esc(group.label)}</span></div>`;

          return `
            <a class="subcategory-card subcategory-card-with-image ${n===0?'is-empty':''}" href="category.html?category=winter&sub=sets&setpack=${encodeURIComponent(group.id)}">
              <div class="subcategory-media">${thumb}</div>
              <div class="subcategory-content">
                <span class="tag">${String(i+1).padStart(2,'0')}</span>
                <h3>${H.esc(group.label)}</h3>
                <span class="count">${n}개 상품</span>
                <span class="subcategory-action">${n>0 ? `${n}개 상품 보기 →` : '상품 준비중'}</span>
              </div>
            </a>`;
        }).join('');

      document.getElementById('category-products').innerHTML =
        allSetProducts.map(H.productCard).join('') ||
        '<div class="empty">아직 등록된 세트상품이 없습니다.</div>';
    }
  }else if(s){
    // 여러 상품이 있는 일반 세부 품목
    subsec.style.display = 'none';
    listsec.style.display = 'block';
    back.href = `category.html?category=${encodeURIComponent(c.id)}`;
    back.textContent = '전체 세부 품목 보기 →';
    document.getElementById('list-title').textContent = s.label;

    const list = d.products.filter(p =>
      p.published !== false &&
      p.category === c.id &&
      p.subcategory === s.id
    );
    document.getElementById('category-products').innerHTML =
      list.map(H.productCard).join('') ||
      '<div class="empty">아직 등록된 상품이 없습니다.</div>';
  }else{
    // 대분류 화면에서는 세부 품목만 보여주고,
    // 상품이 1개면 상세페이지로 바로 연결한다.
    listsec.style.display = 'none';

    document.getElementById('subcategory-list').innerHTML =
      (c.subs||[]).map((x,i)=>{
        const items = d.products.filter(p =>
          p.published !== false &&
          p.category === c.id &&
          p.subcategory === x.id
        );

        const n = items.length;
        const first = items[0];

        let href = '#';
        let actionText = '상품 준비중';

        if(n === 1){
          href = `product.html?id=${encodeURIComponent(first.id)}`;
          actionText = '상품 상세 보기 →';
        }else if(n > 1){
          href = `category.html?category=${encodeURIComponent(c.id)}&sub=${encodeURIComponent(x.id)}`;
          actionText = `${n}개 상품 보기 →`;
        }

        const winterThumbKey = `winter_${x.id}`.replace(/-/g,'_');
        const customThumb = c.id==='winter' ? (winterThumbs[winterThumbKey] || '') : '';
        const thumbSrc = customThumb || (first && first.hero_image ? first.hero_image : '');

        const thumb = thumbSrc
          ? `<img src="${H.esc(thumbSrc.replace(/^\//,''))}" alt="${H.esc(x.label)}">`
          : `<div class="subcategory-placeholder"><span>${H.esc(x.label)}</span></div>`;

        return `
          <a class="subcategory-card subcategory-card-with-image ${n===0?'is-empty':''}" href="${href}">
            <div class="subcategory-media">${thumb}</div>
            <div class="subcategory-content">
              <span class="tag">${String(i+1).padStart(2,'0')}</span>
              <h3>${H.esc(x.label)}</h3>
              <span class="count">${n}개 상품</span>
              <span class="subcategory-action">${actionText}</span>
            </div>
          </a>`;
      }).join('');
  }
})();
</script>
</body>
</html>
