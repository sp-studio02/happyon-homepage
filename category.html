<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>제품 카테고리 | 해피온</title>
  <meta name="description" content="해피온 제품 카테고리">
  <link rel="icon" href="assets/images/logo.png">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<div id="site-header"></div>

<main>
  <section class="sub-hero">
    <div class="container">
      <div class="breadcrumbs" id="breadcrumbs"></div>
      <p class="eyebrow" id="cat-eyebrow">PRODUCTS</p>
      <h1 id="cat-title">제품</h1>
      <p id="cat-desc"></p>
    </div>
  </section>

  <section class="section" id="sub-section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">SUB CATEGORY</p>
          <h2>세부 품목</h2>
        </div>
      </div>
      <div class="subcategory-grid" id="subcategory-list"></div>
    </div>
  </section>

  <section class="section soft" id="list-section">
    <div class="container">
      <div class="section-head">
        <div>
          <p class="eyebrow">PRODUCT LIST</p>
          <h2 id="list-title">등록 상품</h2>
        </div>
        <a class="text-link" id="back-cat" href="#">전체 세부 품목 보기 →</a>
      </div>
      <div class="product-grid" id="category-products"></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="data/seed.js"></script>
<script src="assets/js/app.js"></script>
<script>
(async()=>{
  const d = await H.load();

  let categoryThumbs = {};
  try{
    const r = await fetch(`data/category-thumbnails.json?ts=${Date.now()}`, {cache:'no-store'});
    if(r.ok) categoryThumbs = await r.json();
  }catch(e){}

  H.headerFooter(d.site,'products');

  const cid = H.q('category');
  const sid = H.q('sub');
  const c = d.categories.find(x=>x.id===cid) || d.categories[0];
  const s = (c.subs||[]).find(x=>x.id===sid);

  document.title = (s ? s.label+' | ' : '') + c.label + ' | 해피온';
  document.getElementById('cat-eyebrow').textContent = c.eyebrow || 'PRODUCTS';
  document.getElementById('cat-title').textContent = s ? s.label : c.label;
  document.getElementById('cat-desc').textContent = s
    ? `${c.label} > ${s.label}에 등록된 상품입니다.`
    : c.desc;

  document.getElementById('breadcrumbs').innerHTML =
    `<a href="index.html">홈</a><span>›</span>
     <a href="products.html">제품소개</a><span>›</span>
     ${s
       ? `<a href="category.html?category=${encodeURIComponent(c.id)}">${H.esc(c.label)}</a><span>›</span><strong>${H.esc(s.label)}</strong>`
       : `<strong>${H.esc(c.label)}</strong>`}`;

  const subsec = document.getElementById('sub-section');
  const listsec = document.getElementById('list-section');
  const back = document.getElementById('back-cat');

  if(s){
    // 여러 상품이 있는 세부 품목에서만 이 화면을 사용
    subsec.style.display = 'none';
    listsec.style.display = '';
    back.href = `category.html?category=${encodeURIComponent(c.id)}`;
    document.getElementById('list-title').textContent = s.label;

    const list = d.products.filter(p =>
      p.published !== false &&
      p.category === c.id &&
      p.subcategory === s.id
    );
    document.getElementById('category-products').innerHTML =
      list.map(H.productCard).join('') ||
      '<div class="empty">아직 등록된 상품이 없습니다.</div>';
  }else{
    // 대분류 화면에서는 세부 품목만 보여주고,
    // 상품이 1개면 상세페이지로 바로 연결한다.
    listsec.style.display = 'none';

    document.getElementById('subcategory-list').innerHTML =
      (c.subs||[]).map((x,i)=>{
        const items = d.products.filter(p =>
          p.published !== false &&
          p.category === c.id &&
          p.subcategory === x.id
        );

        const n = items.length;
        const first = items[0];

        let href = '#';
        let actionText = '상품 준비중';

        if(n === 1){
          href = `product.html?id=${encodeURIComponent(first.id)}`;
          actionText = '상품 상세 보기 →';
        }else if(n > 1){
          href = `category.html?category=${encodeURIComponent(c.id)}&sub=${encodeURIComponent(x.id)}`;
          actionText = `${n}개 상품 보기 →`;
        }

        const thumbKey = `${c.id}_${x.id}`.replace(/-/g,'_');
        const customThumb = categoryThumbs[thumbKey] || '';
        const thumbSrc = customThumb || (first && first.hero_image ? first.hero_image : '');

        const thumb = thumbSrc
          ? `<img src="${H.esc(thumbSrc.replace(/^\//,''))}" alt="${H.esc(x.label)}">`
          : `<div class="subcategory-placeholder"><span>${H.esc(x.label)}</span></div>`;

        return `
          <a class="subcategory-card subcategory-card-with-image ${n===0?'is-empty':''}" href="${href}">
            <div class="subcategory-media">${thumb}</div>
            <div class="subcategory-content">
              <span class="tag">${String(i+1).padStart(2,'0')}</span>
              <h3>${H.esc(x.label)}</h3>
              <span class="count">${n}개 상품</span>
              <span class="subcategory-action">${actionText}</span>
            </div>
          </a>`;
      }).join('');
  }
})();
</script>
</body>
</html>
