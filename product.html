<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 상세 | 해피온</title><meta name="description" content="해피온 상품 상세"><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/style.css">
<style>
/* 상세페이지 > 관련 세트상품 카드만 컴팩트하게 */
.related-set-grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:14px;
  margin-top:18px;
}
.related-set-grid .product-card{
  min-width:0;
}
.related-set-grid .product-media{
  aspect-ratio:1/1;
}
.related-set-grid .product-body{
  padding:13px 14px 15px;
}
.related-set-grid .product-meta{
  font-size:10px;
}
.related-set-grid .product-body h3{
  margin:6px 0 5px;
  font-size:15px;
  line-height:1.4;
}
.related-set-grid .product-body p{
  font-size:12px;
  line-height:1.5;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}
.related-set-grid .card-arrow{
  margin-top:10px;
  font-size:12px;
}
@media(max-width:900px){
  .related-set-grid{
    grid-template-columns:repeat(3,minmax(0,1fr));
  }
}
@media(max-width:640px){
  .related-set-grid{
    display:flex;
    gap:10px;
    overflow-x:auto;
    overflow-y:hidden;
    padding:2px 2px 10px;
    margin-right:-16px;
    padding-right:16px;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .related-set-grid::-webkit-scrollbar{
    display:none;
  }

  .related-set-grid .product-card{
    flex:0 0 42vw;
    max-width:160px;
    min-width:138px;
    scroll-snap-align:start;
  }

  .related-set-grid .product-body{
    padding:9px 10px 11px;
  }

  .related-set-grid .product-body h3{
    font-size:13px;
    line-height:1.35;
    display:-webkit-box;
    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .related-set-grid .product-body p{
    font-size:11px;
    -webkit-line-clamp:2;
  }

  .related-set-grid .card-arrow{
    font-size:11px;
  }
}
</style>

<style>
/* 관련 세트상품 영역을 상세본문과 명확히 구분 */
.related-set-section{
  margin:34px 0 38px;
  padding:24px 24px 26px;
  background:#f7f8fa;
  border:1px solid #e1e5ea;
  border-radius:16px;
}

.related-set-heading{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:4px;
}

.related-set-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:5px 9px;
  border-radius:999px;
  background:#1f2d44;
  color:#fff;
  font-size:11px;
  font-weight:800;
  letter-spacing:.04em;
}

.related-set-section h2{
  margin:0;
  font-size:20px;
  line-height:1.35;
}

.related-set-guide{
  margin:7px 0 0;
  color:#6c737d;
  font-size:13px;
  line-height:1.5;
}

.related-set-grid{
  margin-top:18px;
}

@media(max-width:640px){
  .related-set-section{
    margin:26px 0 30px;
    padding:18px 14px 18px;
    border-radius:13px;
  }

  .related-set-section h2{
    font-size:17px;
  }

  .related-set-guide{
    font-size:12px;
  }
}
</style>
</head><body><div id="site-header"></div>
<main><section class="detail-wrap"><div class="container"><div class="breadcrumbs" id="detail-breadcrumbs"></div><div class="detail-top"><div class="detail-main-image" id="detail-image"></div><div class="detail-info"><p class="eyebrow" id="detail-meta"></p><h1 id="detail-title"></h1><p class="detail-summary" id="detail-summary"></p><div class="quick-spec" id="quick-spec"></div><p class="order-note" id="order-note"></p></div></div><section class="detail-section" id="set-section"></section><section class="detail-section" id="spec-section"><h2>제품 정보</h2><div class="spec-table" id="spec-table"></div></section><section class="detail-section" id="features-section"><h2>주요 특징</h2><div class="feature-grid" id="feature-grid"></div></section><div class="gallery" id="gallery"></div><section class="related-set-section detail-section"><div class="section-head"><div><p class="eyebrow">RELATED PRODUCTS</p><h2>같은 품목의 다른 상품</h2></div></div><div class="related-grid" id="related-grid"></div></section></div></section></main>
<div id="site-footer"></div><script src="data/seed.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const d=await H.load();H.headerFooter(d.site,'products');const id=H.q('id');const p=d.products.find(x=>String(x.id)===String(id));if(!p){document.querySelector('.detail-wrap .container').innerHTML='<div class="empty">상품을 찾을 수 없습니다.</div>';return;}const c=d.categories.find(x=>x.id===p.category),s=c?.subs?.find(x=>x.id===p.subcategory);document.title=p.title+' | 해피온';document.getElementById('detail-breadcrumbs').innerHTML=`<a href="index.html">홈</a><span>›</span><a href="products.html">제품소개</a><span>›</span><a href="category.html?category=${encodeURIComponent(p.category)}">${H.esc(c?.label||p.category)}</a><span>›</span><a href="category.html?category=${encodeURIComponent(p.category)}&sub=${encodeURIComponent(p.subcategory)}">${H.esc(s?.label||p.subcategory)}</a><span>›</span><strong>${H.esc(p.title)}</strong>`;document.getElementById('detail-image').innerHTML=H.imageHTML(p.hero_image,p.title);document.getElementById('detail-meta').textContent=(c?.label||'')+' · '+(s?.label||'');document.getElementById('detail-title').textContent=p.title;document.getElementById('detail-summary').textContent=p.summary||'';const quick=[['기본 주문수량',p.default_order_quantity],['제작기간',p.production_time]].filter(x=>x[1]);document.getElementById('quick-spec').innerHTML=quick.map(x=>`<div class="quick-row"><strong>${H.esc(x[0])}</strong><span>${H.esc(x[1])}</span></div>`).join('');document.getElementById('order-note').textContent=p.default_order_quantity?'※ 기본 주문수량 미만은 별도 연락해 주세요.':'';const gal=(p.gallery||[]).filter(Boolean);const ge=document.getElementById('gallery');if(gal.length)ge.innerHTML=gal.map(x=>`<img src="${H.esc(String(x).replace(/^\//,''))}" alt="${H.esc(p.title)} 상세 이미지">`).join('');else ge.style.display='none';const ft=(p.features||[]).filter(x=>x&&x.title);const fs=document.getElementById('features-section');if(ft.length)document.getElementById('feature-grid').innerHTML=ft.map(x=>`<div class="feature-card"><h3>${H.esc(x.title)}</h3><p>${H.esc(x.description||'')}</p></div>`).join('');else fs.style.display='none';const specs=[['규격',p.dimensions],['재질',p.material],['색상',p.colors],['인쇄·제작 방식',p.print_method],['포장 방식',p.packaging],['기본 주문수량',p.default_order_quantity],['제작기간',p.production_time]].filter(x=>x[1]);document.getElementById('spec-table').innerHTML=specs.map(x=>`<div class="row"><strong>${H.esc(x[0])}</strong><span>${H.esc(x[1])}</span></div>`).join('');const set=document.getElementById('set-section');
const selectedSetIds=(Array.isArray(p.related_set_products)?p.related_set_products:[])
  .map(x=>typeof x==='string'?x:(x?.id||x?.value||''))
  .filter(Boolean);
const linkedSets=selectedSetIds
  .map(setId=>d.products.find(x=>String(x.id)===String(setId)&&x.published!==false))
  .filter(Boolean);

const setParts=[];

// 실제 '세트상품' 자체의 상세페이지에는 별도 세트 안내 영역을 표시하지 않습니다.
// '세트 구성 불가'도 동일하게 아무것도 표시하지 않습니다.
// 단품이 '세트 구성 가능'인 경우에만 연결된 세트상품을 보여줍니다.
if(p.set_type==='set_available'){
  if(linkedSets.length){
    setParts.push(`<div class="linked-set-products">
      <div class="related-set-heading">
        <span class="related-set-badge">SET PRODUCT</span>
        <h2>함께 구성 가능한 세트상품</h2>
      </div>
      <p class="related-set-guide">이 상품과 함께 구성할 수 있는 세트상품입니다. 카드를 누르면 해당 세트 상세페이지로 이동합니다.</p>
      <div class="related-set-grid">${linkedSets.map(H.productCard).join('')}</div>
    </div>`);
  }else{
    setParts.push('<div class="set-box"><h3>세트 구성도 가능합니다.</h3><p>세트상품 카테고리를 확인해주세요.</p></div>');
  }
}

if(setParts.length)set.innerHTML=setParts.join('');
else set.style.display='none';const rel=d.products.filter(x=>x.published!==false&&x.id!==p.id&&x.category===p.category&&x.subcategory===p.subcategory).slice(0,4);const rg=document.getElementById('related-grid');if(rel.length)rg.innerHTML=rel.map(H.productCard).join('');else rg.innerHTML='<div class="empty">같은 품목의 다른 등록 상품이 없습니다.</div>';})();</script></body></html>
