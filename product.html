<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>상품 상세 | 해피온</title><meta name="description" content="해피온 상품 상세"><link rel="icon" href="assets/images/logo.png"><link rel="stylesheet" href="assets/css/style.css"></head><body><div id="site-header"></div>
<main><section class="detail-wrap"><div class="container"><div class="breadcrumbs" id="detail-breadcrumbs"></div><div class="detail-top"><div class="detail-main-image" id="detail-image"></div><div class="detail-info"><p class="eyebrow" id="detail-meta"></p><h1 id="detail-title"></h1><p class="detail-summary" id="detail-summary"></p><div class="quick-spec" id="quick-spec"></div><p class="order-note" id="order-note"></p></div></div><div class="gallery" id="gallery"></div><section class="detail-section" id="features-section"><h2>주요 특징</h2><div class="feature-grid" id="feature-grid"></div></section><section class="detail-section" id="spec-section"><h2>제품 정보</h2><div class="spec-table" id="spec-table"></div></section><section class="detail-section" id="set-section"></section><section class="detail-section"><div class="section-head"><div><p class="eyebrow">RELATED PRODUCTS</p><h2>같은 품목의 다른 상품</h2></div></div><div class="related-grid" id="related-grid"></div></section></div></section></main>
<div id="site-footer"></div><script src="data/seed.js"></script><script src="assets/js/app.js"></script><script>(async()=>{const d=await H.load();H.headerFooter(d.site,'products');const id=H.q('id');const p=d.products.find(x=>String(x.id)===String(id));if(!p){document.querySelector('.detail-wrap .container').innerHTML='<div class="empty">상품을 찾을 수 없습니다.</div>';return;}const c=d.categories.find(x=>x.id===p.category),s=c?.subs?.find(x=>x.id===p.subcategory);document.title=p.title+' | 해피온';document.getElementById('detail-breadcrumbs').innerHTML=`<a href="index.html">홈</a><span>›</span><a href="products.html">제품소개</a><span>›</span><a href="category.html?category=${encodeURIComponent(p.category)}">${H.esc(c?.label||p.category)}</a><span>›</span><a href="category.html?category=${encodeURIComponent(p.category)}&sub=${encodeURIComponent(p.subcategory)}">${H.esc(s?.label||p.subcategory)}</a><span>›</span><strong>${H.esc(p.title)}</strong>`;document.getElementById('detail-image').innerHTML=H.imageHTML(p.hero_image,p.title);document.getElementById('detail-meta').textContent=(c?.label||'')+' · '+(s?.label||'');document.getElementById('detail-title').textContent=p.title;document.getElementById('detail-summary').textContent=p.summary||'';const quick=[['기본 주문수량',p.default_order_quantity],['제작기간',p.production_time]].filter(x=>x[1]);document.getElementById('quick-spec').innerHTML=quick.map(x=>`<div class="quick-row"><strong>${H.esc(x[0])}</strong><span>${H.esc(x[1])}</span></div>`).join('');document.getElementById('order-note').textContent=p.default_order_quantity?'※ 기본 주문수량 미만은 별도 연락해 주세요.':'';const gal=(p.gallery||[]).filter(Boolean);const ge=document.getElementById('gallery');if(gal.length)ge.innerHTML=gal.map(x=>`<img src="${H.esc(String(x).replace(/^\//,''))}" alt="${H.esc(p.title)} 상세 이미지">`).join('');else ge.style.display='none';const ft=(p.features||[]).filter(x=>x&&x.title);const fs=document.getElementById('features-section');if(ft.length)document.getElementById('feature-grid').innerHTML=ft.map(x=>`<div class="feature-card"><h3>${H.esc(x.title)}</h3><p>${H.esc(x.description||'')}</p></div>`).join('');else fs.style.display='none';const specs=[['규격',p.dimensions],['재질',p.material],['색상',p.colors],['인쇄·제작 방식',p.print_method],['포장 방식',p.packaging],['기본 주문수량',p.default_order_quantity],['제작기간',p.production_time]].filter(x=>x[1]);document.getElementById('spec-table').innerHTML=specs.map(x=>`<div class="row"><strong>${H.esc(x[0])}</strong><span>${H.esc(x[1])}</span></div>`).join('');const set=document.getElementById('set-section');if(p.set_type==='set_product'){const items=(p.set_contents||[]).filter(Boolean);set.innerHTML=`<div class="set-box"><p class="eyebrow">SET PRODUCT</p><h3>${H.esc(p.set_name||'세트 구성')}</h3>${p.set_packaging?`<p>포장 형태: ${H.esc(p.set_packaging)}</p>`:''}${p.set_description?`<p>${H.esc(p.set_description)}</p>`:''}${items.length?`<ul class="set-items">${items.map(x=>`<li>${H.esc(typeof x==='string'?x:(x.name||''))}</li>`).join('')}</ul>`:''}</div>`;}else if(p.set_type==='set_available'){set.innerHTML='<div class="set-box"><h3>세트 구성도 가능합니다.</h3><p>세트상품 카테고리를 확인해주세요.</p></div>';}else set.style.display='none';const rel=d.products.filter(x=>x.published!==false&&x.id!==p.id&&x.category===p.category&&x.subcategory===p.subcategory).slice(0,4);const rg=document.getElementById('related-grid');if(rel.length)rg.innerHTML=rel.map(H.productCard).join('');else rg.innerHTML='<div class="empty">같은 품목의 다른 등록 상품이 없습니다.</div>';})();</script></body></html>
